    <main id="main-content">
        <h1>Register</h1>
        <section><h2>Create an account</h2><form action="#" method="get"><p><label for="full-name">Full name</label><br><input id="full-name" name="full-name" type="text" autocomplete="name" required></p><p><label for="email">Email address</label><br><input id="email" name="email" type="email" autocomplete="email" required></p><p><label for="course">Course</label><br><select id="course" name="course" required><option value="">Choose a course</option><option value="it">Information Technology</option><option value="cse">Computer Science</option></select></p><p><label for="new-password">Password</label><br><input id="new-password" name="password" type="password" autocomplete="new-password" required></p><p><input id="terms" name="terms" type="checkbox" required> <label for="terms">I agree to the terms</label></p><button type="submit">Create account</button></form></section>
